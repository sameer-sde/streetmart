<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StreetMart — Fresh Vegetables Near You</title>
    <meta name="description" content="Connect with local street vegetable vendors near you. Fresh produce, live availability, multiple languages." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#25a463" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StreetMart" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Open Graph (for GitHub / social sharing) -->
    <meta property="og:title" content="StreetMart — Fresh Vegetables Near You" />
    <meta property="og:description" content="Connect with local street vegetable vendors. Live prices, stock, multilingual." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/screenshot1.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW failed:', err));
        });
      }
    </script>
  </body>
</html>
